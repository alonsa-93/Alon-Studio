name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Types (gate 1)
        run: npm run typecheck
      - name: Logic regression and both UI languages (gate 2, without the server part)
        run: npx tsx scripts/regress.ts
        env:
          REGRESS_OFFLINE: '1'
          ALON_DATA_DIR: ${{ runner.temp }}/alon-ci-data
      - name: Known vulnerabilities in npm dependencies
        run: npm audit --audit-level=high
